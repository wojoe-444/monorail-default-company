name: Lint SQLX on PR

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '**/*.sqlx'
      - '.sqlfluff'

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: sqlx-lint-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  lint-sqlx:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Identify changed SQLX files in PR
        id: scope
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pr.number,
              per_page: 100
            });

            const changedSqlx = files
              .filter(f => f.status !== 'removed' && f.filename.endsWith('.sqlx'))
              .map(f => f.filename)
              .sort();

            const listFile = path.join(process.env.RUNNER_TEMP, 'changed-sqlx.txt');
            fs.writeFileSync(listFile, changedSqlx.join('\n') + (changedSqlx.length ? '\n' : ''), 'utf8');

            const canPush =
              Boolean(pr.head?.repo?.full_name) &&
              pr.head.repo.full_name === `${owner}/${repo}`;

            core.setOutput('has_sqlx_files', changedSqlx.length > 0 ? 'true' : 'false');
            core.setOutput('sqlx_count', String(changedSqlx.length));
            core.setOutput('can_push', canPush ? 'true' : 'false');
            core.info(`Found ${changedSqlx.length} changed .sqlx file(s). Same-repo push allowed: ${canPush}`);

      - name: Checkout PR branch
        if: steps.scope.outputs.has_sqlx_files == 'true' && steps.scope.outputs.can_push == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Checkout PR head (read-only fork)
        if: steps.scope.outputs.has_sqlx_files == 'true' && steps.scope.outputs.can_push != 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        if: steps.scope.outputs.has_sqlx_files == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SQLFluff
        if: steps.scope.outputs.has_sqlx_files == 'true'
        run: python -m pip install --upgrade pip && pip install sqlfluff==4.5.0

      - name: Auto-fix standard SQLX rules and collect advisory warnings
        if: steps.scope.outputs.has_sqlx_files == 'true'
        id: lint
        run: |
          python scripts/lint-sqlx.py \
            --files-from "$RUNNER_TEMP/changed-sqlx.txt" \
            --fix \
            --report-json "$RUNNER_TEMP/sqlx-lint-report.json" \
            --annotations

      - name: Commit and push SQLX auto-lint fixes to PR branch
        if: steps.scope.outputs.has_sqlx_files == 'true' && steps.scope.outputs.can_push == 'true'
        id: commit
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          mapfile -t modified_files < <(git diff --name-only -- '*.sqlx')
          if [ "${#modified_files[@]}" -eq 0 ]; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "lint_commit_sha=" >> "$GITHUB_OUTPUT"
            echo "No auto-fix changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- "${modified_files[@]}"

          commit_body=$(python - "$RUNNER_TEMP/sqlx-lint-report.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1], encoding="utf-8"))
          lines = ["Applied automated SQLFluff standard fixes (.sqlfluff):", ""]
          for f in report.get("files", []):
              if f.get("changed"):
                  rules = ", ".join(
                      f"{k} ({v})" for k, v in sorted(f.get("fixed_rule_counts", {}).items())
                  ) or "whitespace/formatting"
                  lines.append(f"- {f['path']}: {rules}")
          print("\n".join(lines))
          PY
          )

          git commit -m "style(sqlx): auto-lint changed SQLX files with SQLFluff" -m "$commit_body"
          git push origin "HEAD:${HEAD_REF}"

          new_sha=$(git rev-parse HEAD)
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "lint_commit_sha=${new_sha}" >> "$GITHUB_OUTPUT"
          echo "Pushed auto-lint commit ${new_sha} to ${HEAD_REF}."

      - name: Render detailed SQLX lint comment
        if: steps.scope.outputs.has_sqlx_files == 'true'
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LINT_COMMIT_SHA: ${{ steps.commit.outputs.lint_commit_sha }}
          CAN_PUSH: ${{ steps.scope.outputs.can_push }}
        run: |
          target_sha="${LINT_COMMIT_SHA:-$PR_HEAD_SHA}"
          extra_args=()
          if [ "$CAN_PUSH" != "true" ]; then
            extra_args+=(--fork-pr)
          fi

          python scripts/lint-sqlx.py \
            --render-comment "$RUNNER_TEMP/sqlx-lint-report.json" \
            --comment-md "$RUNNER_TEMP/sqlx-lint-comment.md" \
            --repo "${{ github.repository }}" \
            --head-sha "$target_sha" \
            --lint-commit-sha "$LINT_COMMIT_SHA" \
            "${extra_args[@]}"

      - name: Post or update PR lint comment and Job Summary
        if: steps.scope.outputs.has_sqlx_files == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;
            const marker = '<!-- monorail-sqlfluff-lint -->';

            const commentBody = fs.readFileSync(
              path.join(process.env.RUNNER_TEMP, 'sqlx-lint-comment.md'),
              'utf8'
            );

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: prNumber,
              per_page: 100
            });
            const existing = comments.find(c => (c.body || '').includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body: commentBody
              });
            }

            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, commentBody + '\n');

      - name: Fail if unfixable standard violations or parse errors remain
        if: steps.scope.outputs.has_sqlx_files == 'true'
        run: |
          python - "$RUNNER_TEMP/sqlx-lint-report.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1], encoding="utf-8"))
          s = report["summary"]
          unfixable = s.get("unfixable_standard_count", 0)
          errors = s.get("error_files", 0)
          advisory = s.get("advisory_warning_count", 0)
          print(
              f"Final status: {unfixable} unfixable standard violation(s), "
              f"{errors} file error(s), {advisory} advisory warning(s)."
          )
          if unfixable > 0 or errors > 0:
              print(
                  "Unfixable standard SQLFluff violations or parse errors remain. "
                  "See the SQLFluff PR comment for exact file/line details.",
                  file=sys.stderr,
              )
              sys.exit(1)
          PY
